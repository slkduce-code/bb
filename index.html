<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CLASSIC BLOCKS - 테트리스</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#171f35;--line:#34405d;--gold:#f6cb65}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#243456,#0b1020 70%);font-family:system-ui,'Malgun Gothic',sans-serif;color:#eef2ff;display:flex;justify-content:center;align-items:center;padding:18px}.shell{width:min(850px,100%)}header{text-align:center;margin-bottom:15px}h1{font-size:clamp(25px,4vw,40px);letter-spacing:5px;color:var(--gold);text-shadow:0 3px #6b4d23;margin:0}header p{margin:6px;color:#a9b7d4;font-size:13px}.layout{display:flex;gap:16px;justify-content:center;align-items:stretch}.panel{background:#151e33;border:2px solid #344462;border-radius:12px;padding:15px;box-shadow:0 12px 28px #0005}.side{width:185px;display:flex;flex-direction:column;gap:12px}.stat{background:#0c1528;border:1px solid #35445d;border-radius:8px;padding:10px}.stat label{display:block;color:#9aaed0;font-size:11px;letter-spacing:1px}.stat strong{font:700 25px ui-monospace,Consolas,monospace;color:#fff}.gamebox{position:relative;padding:7px;background:#090f1d;border:3px solid #607293;border-radius:9px}#board{display:block;width:min(300px,45vw);height:auto;image-rendering:pixelated}.overlay{position:absolute;inset:7px;background:#07101cdd;display:flex;align-items:center;justify-content:center;text-align:center;flex-direction:column;padding:12px;z-index:2}.overlay.hidden{display:none}.overlay h2{color:#f7d77c;margin:0 0 8px;font-size:25px}.overlay p{font-size:13px;color:#d4dff5;line-height:1.7}.btn{cursor:pointer;border:1px solid #a98b49;background:linear-gradient(#f8d87b,#c99539);color:#192137;font-weight:800;border-radius:7px;padding:10px 9px;font-size:14px}.btn:hover{filter:brightness(1.12)}.btn.secondary{background:#253552;color:#e6efff;border-color:#587095}.btn:disabled{opacity:.45;cursor:not-allowed}.controls{font-size:12px;color:#b4c3e2;line-height:1.9}.controls b{color:#f4d384}.next{width:100%;height:90px;image-rendering:pixelated}.mobile{display:none;margin-top:14px;gap:8px;justify-content:center;flex-wrap:wrap}.mobile button{touch-action:none;min-width:54px;min-height:52px;border-radius:8px;border:1px solid #647ca2;background:#263b5c;color:white;font-size:21px;font-weight:800}.foot{text-align:center;color:#8193b2;font-size:12px;margin-top:12px}@media(max-width:650px){.layout{gap:8px}.panel{padding:8px}.side{width:115px;gap:8px}.stat{padding:7px}.stat strong{font-size:20px}.controls{font-size:10px}.side .btn{font-size:11px;padding:9px 3px}#board{width:min(300px,51vw)}.mobile{display:flex}}
</style>
</head>
<body><main class="shell"><header><h1>CLASSIC BLOCKS</h1><p>레트로 감성의 HTML 테트리스 · 설치 없이 플레이</p></header><div class="layout"><aside class="panel side"><div class="stat"><label>SCORE</label><strong id="score">0</strong></div><div class="stat"><label>HIGH SCORE</label><strong id="high">0</strong></div><div class="stat"><label>LINES</label><strong id="lines">0</strong></div><div class="stat"><label>LEVEL</label><strong id="level">1</strong></div><div class="stat"><label>NEXT</label><canvas id="next" class="next" width="120" height="90"></canvas></div></aside><div class="gamebox"><canvas id="board" width="300" height="600" aria-label="테트리스 게임판"></canvas><div class="overlay" id="overlay"><h2 id="overlayTitle">READY?</h2><p id="overlayText">블록을 움직여 가로줄을 완성하세요!<br>스페이스바로 즉시 떨어뜨릴 수 있어요.</p><button class="btn" id="overlayBtn">게임 시작</button></div></div><aside class="panel side"><button class="btn" id="start">새 게임</button><button class="btn secondary" id="pause">일시정지 (P)</button><button class="btn secondary" id="sound">소리: 켜짐</button><div class="controls"><b>조작 방법</b><br>← → 좌우 이동<br>↑ 블록 회전<br>↓ 빠르게 내리기<br>Space 즉시 내리기<br>P 일시정지<br>R 다시 시작</div></aside></div><div class="mobile"><button data-key="ArrowLeft">◀</button><button data-key="ArrowDown">▼</button><button data-key="ArrowRight">▶</button><button data-key="ArrowUp">⟳</button><button data-key="Space">⤓</button><button data-key="KeyP">Ⅱ</button></div><p class="foot">한 줄 100점 · 두 줄 300점 · 세 줄 500점 · 네 줄 800점 (레벨 배수)</p></main>
<script>
(()=>{'use strict';const W=10,H=20,S=30,canvas=document.getElementById('board'),ctx=canvas.getContext('2d'),nextCtx=document.getElementById('next').getContext('2d');const $=id=>document.getElementById(id);const COLORS={I:'#36d7ed',O:'#f8d84b',T:'#b26aef',S:'#57db83',Z:'#f16a76',J:'#6289ed',L:'#f3a653'};const SHAPES={I:[[1,1,1,1]],O:[[1,1],[1,1]],T:[[0,1,0],[1,1,1]],S:[[0,1,1],[1,1,0]],Z:[[1,1,0],[0,1,1]],J:[[1,0,0],[1,1,1]],L:[[0,0,1],[1,1,1]]};let grid,active,queue=[],bag=[],score=0,lines=0,level=1,high=0,playing=false,paused=false,last=0,fall=0,raf=0,soundOn=true,audio=null;try{high=Number(localStorage.getItem('classic-blocks-high')||0)}catch(e){}$('high').textContent=high;
function tone(freq=440,dur=.06,type='square',vol=.025){if(!soundOn)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const osc=audio.createOscillator(),gain=audio.createGain();osc.type=type;osc.frequency.setValueAtTime(freq,audio.currentTime);gain.gain.setValueAtTime(vol,audio.currentTime);gain.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);osc.connect(gain);gain.connect(audio.destination);osc.start();osc.stop(audio.currentTime+dur)}catch(e){}}
function refill(){if(!bag.length){bag=Object.keys(SHAPES);for(let i=bag.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[bag[i],bag[j]]=[bag[j],bag[i]]}}return bag.pop()}
function getNext(){while(queue.length<4)queue.push(refill());return queue.shift()}
function clone(m){return m.map(r=>r.slice())}
function spawn(){const type=getNext(),matrix=clone(SHAPES[type]);active={type,matrix,x:Math.floor((W-matrix[0].length)/2),y:0};drawNext();if(!valid(active.matrix,active.x,active.y))endGame()}
function valid(m,x,y){for(let r=0;r<m.length;r++)for(let c=0;c<m[r].length;c++)if(m[r][c]){const nx=x+c,ny=y+r;if(nx<0||nx>=W||ny>=H||(ny>=0&&grid[ny][nx]))return false}return true}
function move(dx,dy){if(!playing||paused)return false;if(valid(active.matrix,active.x+dx,active.y+dy)){active.x+=dx;active.y+=dy;if(dy)fall=0;draw();return true}if(dy)lock();return false}
function rotate(){if(!playing||paused)return;const m=active.matrix;const rotated=m[0].map((_,c)=>m.map(row=>row[c]).reverse());for(const dx of [0,-1,1,-2,2])if(valid(rotated,active.x+dx,active.y)){active.matrix=rotated;active.x+=dx;tone(510,.035);draw();return}}
function hardDrop(){if(!playing||paused)return;let n=0;while(valid(active.matrix,active.x,active.y+1)){active.y++;n++}score+=n*2;update();tone(155,.1);lock()}
function lock(){for(let r=0;r<active.matrix.length;r++)for(let c=0;c<active.matrix[r].length;c++)if(active.matrix[r][c]){const y=active.y+r;if(y<0){endGame();return}grid[y][active.x+c]=active.type}let cleared=0;for(let r=H-1;r>=0;r--){if(grid[r].every(Boolean)){grid.splice(r,1);grid.unshift(Array(W).fill(null));cleared++;r++}}if(cleared){score+=([0,100,300,500,800][cleared])*level;lines+=cleared;level=1+Math.floor(lines/10);tone(660,.12);setTimeout(()=>tone(880,.15),90)}update();spawn();draw()}
function update(){$('score').textContent=score.toLocaleString();$('lines').textContent=lines;$('level').textContent=level;if(score>high){high=score;$('high').textContent=high.toLocaleString();try{localStorage.setItem('classic-blocks-high',high)}catch(e){}}}
function tile(context,x,y,size,color,ghost=false){context.fillStyle=ghost?'#24364d':color;context.fillRect(x+1,y+1,size-2,size-2);if(!ghost){context.fillStyle='#ffffff55';context.fillRect(x+3,y+3,size-6,3);context.fillRect(x+3,y+3,3,size-6);context.fillStyle='#00000055';context.fillRect(x+3,y+size-6,size-6,3);context.fillRect(x+size-6,y+3,3,size-6)}else{context.strokeStyle=color;context.lineWidth=2;context.strokeRect(x+2,y+2,size-4,size-4)}}
function draw(){ctx.fillStyle='#0a1324';ctx.fillRect(0,0,300,600);ctx.strokeStyle='#1b2940';ctx.lineWidth=.6;for(let x=0;x<=W;x++){ctx.beginPath();ctx.moveTo(x*S,0);ctx.lineTo(x*S,H*S);ctx.stroke()}for(let y=0;y<=H;y++){ctx.beginPath();ctx.moveTo(0,y*S);ctx.lineTo(W*S,y*S);ctx.stroke()}if(!grid)return;for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(grid[y][x])tile(ctx,x*S,y*S,S,COLORS[grid[y][x]]);if(active&&playing){let gy=active.y;while(valid(active.matrix,active.x,gy+1))gy++;for(let r=0;r<active.matrix.length;r++)for(let c=0;c<active.matrix[r].length;c++)if(active.matrix[r][c]){if(gy+r>=0)tile(ctx,(active.x+c)*S,(gy+r)*S,S,COLORS[active.type],true);if(active.y+r>=0)tile(ctx,(active.x+c)*S,(active.y+r)*S,S,COLORS[active.type])}}}
function drawNext(){nextCtx.clearRect(0,0,120,90);const type=queue[0];if(!type)return;const m=SHAPES[type],size=22,ox=(120-m[0].length*size)/2,oy=(90-m.length*size)/2;for(let y=0;y<m.length;y++)for(let x=0;x<m[y].length;x++)if(m[y][x])tile(nextCtx,ox+x*size,oy+y*size,size,COLORS[type])}
function show(title,message,button){$('overlayTitle').textContent=title;$('overlayText').innerHTML=message;$('overlayBtn').textContent=button;$('overlay').classList.remove('hidden')}
function hide(){$('overlay').classList.add('hidden')}
function newGame(){grid=Array.from({length:H},()=>Array(W).fill(null));queue=[];bag=[];active=null;score=0;lines=0;level=1;fall=0;last=0;playing=true;paused=false;$('pause').textContent='일시정지 (P)';update();spawn();hide();draw();tone(440,.08);if(!raf)raf=requestAnimationFrame(loop)}
function endGame(){playing=false;paused=false;tone(130,.3,'sawtooth');show('GAME OVER',`최종 점수: <b>${score.toLocaleString()}</b><br>완성한 줄: ${lines}`, '다시 도전');draw()}
function togglePause(){if(!playing)return;paused=!paused;$('pause').textContent=paused?'계속하기 (P)':'일시정지 (P)';if(paused)show('PAUSED','P 키 또는 아래 버튼으로 계속하세요.','계속하기');else{hide();last=0}}
function loop(t){raf=requestAnimationFrame(loop);if(!playing||paused){last=t;return}if(!last)last=t;fall+=Math.min(t-last,100);last=t;const speed=Math.max(85,850*Math.pow(.83,level-1));if(fall>=speed){fall=0;move(0,1)}draw()}
function key(k){if(k==='KeyP'||k==='p'||k==='P'){togglePause();return}if(k==='KeyR'||k==='r'||k==='R'){newGame();return}if(!playing||paused)return;switch(k){case'ArrowLeft':move(-1,0);tone(245,.025);break;case'ArrowRight':move(1,0);tone(245,.025);break;case'ArrowDown':if(move(0,1)){score++;update()}break;case'ArrowUp':case'KeyX':rotate();break;case'Space':case' ':hardDrop();break}}
document.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowDown','ArrowUp','Space',' ','KeyP','KeyR','KeyX'].includes(e.code)||['ArrowLeft','ArrowRight','ArrowDown','ArrowUp',' '].includes(e.key))e.preventDefault();if(e.repeat&&['Space','KeyP','KeyR'].includes(e.code))return;key(e.code)});$('start').onclick=newGame;$('pause').onclick=togglePause;$('overlayBtn').onclick=()=>{if(playing&&paused)togglePause();else newGame()};$('sound').onclick=()=>{soundOn=!soundOn;$('sound').textContent='소리: '+(soundOn?'켜짐':'꺼짐');if(soundOn)tone()};let repeatTimer=null;document.querySelectorAll('[data-key]').forEach(btn=>{const k=btn.dataset.key;const stop=()=>{clearTimeout(repeatTimer);clearInterval(repeatTimer);repeatTimer=null};btn.addEventListener('pointerdown',e=>{e.preventDefault();btn.setPointerCapture(e.pointerId);key(k);if(['ArrowLeft','ArrowRight','ArrowDown'].includes(k))repeatTimer=setTimeout(()=>{repeatTimer=setInterval(()=>key(k),85)},210)});btn.addEventListener('pointerup',stop);btn.addEventListener('pointercancel',stop)});grid=Array.from({length:H},()=>Array(W).fill(null));draw();})();
</script></body></html>
